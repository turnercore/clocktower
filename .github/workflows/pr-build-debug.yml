name: PR build debug

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clocktower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clocktower/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_DOMAIN: https://www.clocktower.monster
          NEXT_PUBLIC_SUPABASE_URL: https://estelamtbxdegwijmyha.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
          SUPABASE_SERVICE_KEY: local-build-placeholder
      - run: npm run tests -- --runInBand
      - name: Run invitation SQL regression tests
        run: |
          runtime="$(mktemp -d)"
          npm install --prefix "$runtime" --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
          node supabase/tests/run_tower_invitations.mjs "$runtime"
